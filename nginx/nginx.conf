worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # DNS Docker: имена контейнеров резолвятся на каждый запрос, а не один раз при
    # старте. Иначе после `up -d --build` контейнеры получают новые IP, а nginx
    # держит старые в кеше → 502 у посетителей до ручного restart nginx.
    # По той же причине не используем upstream-блоки: с ними nginx резолвит имя
    # при старте и падает, если контейнер ещё не поднялся.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $host $api_backend { default http://server:5000; }
    map $host $client_backend { default http://client:80; }
    map $host $admin_backend { default http://admin:80; }

    # HTTP: ACME-проверка (для продления) + редирект на HTTPS
    server {
        listen 80 default_server;
        server_name tbgroup.kz www.tbgroup.kz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: www -> apex (301, единый канонический хост для SEO)
    server {
        listen 443 ssl;
        http2 on;
        server_name www.tbgroup.kz;

        ssl_certificate     /etc/letsencrypt/live/tbgroup.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tbgroup.kz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://tbgroup.kz$request_uri;
    }

    # HTTPS: публичный сайт
    server {
        listen 443 ssl;
        http2 on;
        server_name tbgroup.kz;

        ssl_certificate     /etc/letsencrypt/live/tbgroup.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tbgroup.kz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 10M;

        location /api {
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        location /uploads {
            proxy_pass $api_backend;
        }

        location / {
            proxy_pass $client_backend;
            proxy_set_header Host $host;

            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
        }
    }

    # Админка HTTP: ACME + редирект на HTTPS
    server {
        listen 80;
        server_name admin.tbgroup.kz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Админка HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.tbgroup.kz;

        ssl_certificate     /etc/letsencrypt/live/tbgroup.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tbgroup.kz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 10M;

        location /api {
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        location /uploads {
            proxy_pass $api_backend;
        }

        location / {
            proxy_pass $admin_backend;
            proxy_set_header Host $host;

            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
    }
}
