services:
  mongodb:
    image: mongo:7
    container_name: tbgroup-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Только localhost хоста (для админ-инструментов), не наружу.
    # Серверу этот проброс не нужен — он ходит по внутренней сети tbgroup-net.
    ports:
      - '127.0.0.1:27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tbgroup-net

  server:
    # Образ собирает GitHub Actions и кладёт в GHCR; `build` остаётся фолбэком
    # для локальной разработки и аварийной сборки прямо на сервере.
    image: ghcr.io/${GHCR_OWNER:-scooter67-lab}/tbgroup-api:${IMAGE_TAG:-latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tbgroup-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    # Только localhost хоста (отладка). Наружу API отдаётся через nginx по HTTPS —
    # прямой доступ по :5000 минует TLS и заголовки безопасности.
    ports:
      - '127.0.0.1:5000:5000'
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tbgroup-net

  client:
    image: ghcr.io/${GHCR_OWNER:-scooter67-lab}/tbgroup-client:${IMAGE_TAG:-latest}
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: tbgroup-client
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tbgroup-net

  admin:
    image: ghcr.io/${GHCR_OWNER:-scooter67-lab}/tbgroup-admin:${IMAGE_TAG:-latest}
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: tbgroup-admin
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tbgroup-net

  nginx:
    image: nginx:alpine
    container_name: tbgroup-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - server
      - client
      - admin
    networks:
      - tbgroup-net

volumes:
  mongo_data:
  uploads_data:

networks:
  tbgroup-net:
    driver: bridge
