server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # $uri/index.html вместо $uri/ — отдаём пререндеренные страницы
        # без 301-редиректа на слэш (важно для SEO: canonical без слэша)
        try_files $uri $uri/index.html /index.html;
    }

    # Ассеты сборки (JS/CSS/картинки) — имя содержит хэш контента,
    # поэтому кэш навечно: смена содержимого = новое имя файла.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Шрифты (public/fonts, без хэша в имени, но обновляются крайне редко).
    location ~* \.woff2?$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Прочая статика в public/ без хэша — короткий кэш на случай замены файла.
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
