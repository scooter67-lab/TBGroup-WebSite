server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # $uri/index.html вместо $uri/ — отдаём пререндеренные страницы
        # без 301-редиректа на слэш (важно для SEO: canonical без слэша)
        try_files $uri $uri/index.html /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
