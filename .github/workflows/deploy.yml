name: Build & Deploy

# Сборка образов на runner'е GitHub, а не на VPS: у сервера 1 vCPU / 2 ГБ RAM,
# и `vite build` там занимал минуты и рисковал упереться в память.
# На прод приезжают готовые образы из GHCR.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: client
            context: ./client
          - name: admin
            context: ./admin
          - name: api
            context: ./server
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tbgroup-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/tbgroup-${{ matrix.name }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Выкатка на прод по SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # git pull нужен для docker-compose.yml и nginx.conf — они читаются с диска.
          # IMAGE_TAG фиксирует конкретную сборку: для отката достаточно повторить
          # up -d со старым sha.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" \
            "cd ~/TBGroup-WebSite && git pull --ff-only && IMAGE_TAG=$TAG GHCR_OWNER=$OWNER docker compose pull && IMAGE_TAG=$TAG GHCR_OWNER=$OWNER docker compose up -d && docker image prune -f && docker compose ps"

      - name: Проверка прода
        run: |
          sleep 10
          for path in / /cases /services/moysklad; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://tbgroup.kz$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          curl -fsS https://tbgroup.kz/api/health
